<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TINASHE — The Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0807; --panel:#120f0d; --line:#2a231d; --text:#efe6da; --mute:#8d8174;
  --gold:#d4b483; --gold2:#f3dcae; --glow:rgba(212,180,131,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:
    radial-gradient(900px 500px at 85% -10%,var(--glow),transparent 60%),
    radial-gradient(700px 500px at -10% 110%,rgba(120,60,40,.18),transparent 60%),
    var(--bg);
  color:var(--text);font-family:Inter,system-ui,sans-serif;font-weight:300;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
.wrap{max-width:1180px;margin:0 auto;padding:48px 24px 80px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:28px;margin-bottom:36px}
.eyebrow{letter-spacing:.42em;font-size:11px;color:var(--gold);text-transform:uppercase}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;font-size:clamp(48px,9vw,104px);
  line-height:.9;letter-spacing:.04em;margin-top:14px;
  background:linear-gradient(180deg,var(--gold2),var(--gold) 60%,#8a6f46);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 em{font-style:italic;font-weight:300}
.count{font-size:12px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:32px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.stage{background:linear-gradient(180deg,#16120f,var(--panel));border:1px solid var(--line);border-radius:6px;overflow:hidden;
  box-shadow:0 40px 80px -30px rgba(0,0,0,.8)}
.screen{aspect-ratio:16/9;background:#000;position:relative;display:grid;place-items:center}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.empty{text-align:center;padding:24px;color:var(--mute)}
.empty b{display:block;font-family:"Cormorant Garamond",serif;font-weight:300;font-size:30px;color:var(--gold);margin-bottom:8px}
.sc-wrap{position:absolute;inset:0;display:grid;align-items:center;padding:16px;background:
  radial-gradient(circle at 30% 30%,rgba(212,180,131,.12),transparent 60%),#0c0a09}
.meta{padding:24px 28px 8px}
.meta .n{font-size:11px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.meta h2{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:42px;margin:6px 0 4px}
.meta p{color:var(--mute);font-size:14px;min-height:20px}
.controls{display:flex;align-items:center;gap:10px;padding:16px 28px 26px}
.btn{background:none;border:1px solid var(--line);color:var(--text);height:44px;min-width:44px;padding:0 16px;border-radius:99px;
  font:inherit;font-size:12px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:.25s}
.btn:hover{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 24px var(--glow)}
.btn.main{background:var(--gold);color:#1a130b;border-color:var(--gold);font-weight:500}
.btn.main:hover{background:var(--gold2);color:#1a130b}
.spacer{flex:1}
.list{border:1px solid var(--line);border-radius:6px;background:var(--panel);display:flex;flex-direction:column;max-height:720px}
.search{padding:18px 20px;border-bottom:1px solid var(--line)}
.search input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--text);
  font:inherit;font-size:14px;padding:8px 0;outline:none;letter-spacing:.05em}
.search input:focus{border-color:var(--gold)}
.tracks{overflow:auto;flex:1}
.t{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid #1c1713;cursor:pointer;transition:.2s}
.t:hover{background:rgba(212,180,131,.05)}
.t.on{background:linear-gradient(90deg,rgba(212,180,131,.12),transparent)}
.t .i{font-family:"Cormorant Garamond",serif;font-size:20px;color:var(--mute)}
.t.on .i{color:var(--gold)}
.t .nm{font-family:"Cormorant Garamond",serif;font-size:22px;text-transform:capitalize}
.t .sub{font-size:11px;color:var(--mute);letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.tag{font-size:10px;letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:4px 9px;color:var(--mute)}
.tag.yt{color:#e7a59b}.tag.sc{color:#e9b57d}
footer{margin-top:40px;color:var(--mute);font-size:12px;line-height:1.7;text-align:center;letter-spacing:.04em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">The Unreleased Archive</div>
      <h1>Tina<em>she</em><br>The Vault</h1>
    </div>
    <div class="count" id="count"></div>
  </header>

  <div class="grid">
    <section class="stage">
      <div class="screen" id="screen"></div>
      <div class="meta">
        <div class="n" id="mNum"></div>
        <h2 id="mTitle"></h2>
        <p id="mNote"></p>
      </div>
      <div class="controls">
        <button class="btn" id="prev">Prev</button>
        <button class="btn main" id="next">Next</button>
        <button class="btn" id="shuffle">Shuffle</button>
        <span class="spacer"></span>
        <a class="btn" id="open" target="_blank" rel="noopener" style="display:none;text-decoration:none;line-height:42px">Open Source</a>
      </div>
    </section>

    <aside class="list">
      <div class="search"><input id="q" placeholder="Search the vault…" autocomplete="off"></div>
      <div class="tracks" id="tracks"></div>
    </aside>
  </div>

  <footer>
    Fan-made archive. Playback uses official SoundCloud &amp; YouTube embeds only — no files are hosted here.<br>
    Support the artist: stream the official catalog.
  </footer>
</div>

<script>
/* ───────── EDIT HERE ─────────
   Paste a YouTube or SoundCloud track URL into `url` for each song.
   `note` is optional (e.g. "demo", "snippet", "leak era"). */
const TRACKS = [
  {title:"prisoner",            url:"", note:""},
  {title:"money",               url:"", note:""},
  {title:"no contest (demo)",   url:"", note:"Demo"},
  {title:"rain",                url:"", note:""},
  {title:"make me",             url:"", note:""},
  {title:"underneath the lights",url:"", note:""},
  {title:"instructions",        url:"", note:""},
  {title:"eat you up",          url:"", note:""},
  {title:"fashion nova",        url:"", note:""},
  {title:"pay me",              url:"", note:""},
  {title:"taboo",               url:"", note:""},
  {title:"stranger",            url:"", note:""},
  {title:"by your side",        url:"", note:""},
];

const $ = id => document.getElementById(id);
const pad = n => String(n+1).padStart(2,"0");
let cur = 0, filter = "";

function kind(u){
  if(!u) return null;
  if(/youtu\.?be/.test(u)) return "yt";
  if(/soundcloud\.com/.test(u)) return "sc";
  return null;
}
function ytId(u){
  const m = u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
  return m && m[1];
}
function embed(t){
  const k = kind(t.url);
  if(k==="yt"){
    const id = ytId(t.url);
    if(id) return `<iframe src="https://www.youtube.com/embed/${id}?rel=0&modestbranding=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
  }
  if(k==="sc"){
    return `<div class="sc-wrap"><iframe style="position:static;height:166px" scrolling="no" allow="autoplay"
      src="https://w.soundcloud.com/player/?url=${encodeURIComponent(t.url)}&color=%23d4b483&auto_play=false&hide_related=true&show_comments=false&visual=false"></iframe></div>`;
  }
  return `<div class="empty"><b>${t.title}</b>Add a verified SoundCloud or YouTube link in the TRACKS list.</div>`;
}

function load(i){
  cur = i;
  const t = TRACKS[i];
  $("screen").innerHTML = embed(t);
  $("mNum").textContent = `Track ${pad(i)} / ${pad(TRACKS.length-1)}`;
  $("mTitle").textContent = t.title;
  $("mNote").textContent = t.note || (kind(t.url) ? "Unreleased" : "Link pending");
  const o = $("open");
  if(t.url){o.href=t.url;o.style.display="";}else o.style.display="none";
  render();
}
function render(){
  const box = $("tracks"); box.innerHTML = "";
  TRACKS.forEach((t,i)=>{
    if(filter && !t.title.toLowerCase().includes(filter)) return;
    const k = kind(t.url);
    const d = document.createElement("div");
    d.className = "t"+(i===cur?" on":"");
    d.innerHTML = `<div class="i">${pad(i)}</div>
      <div><div class="nm">${t.title}</div><div class="sub">${t.note||"Unreleased"}</div></div>
      <span class="tag ${k||""}">${k==="yt"?"YouTube":k==="sc"?"SoundCloud":"Pending"}</span>`;
    d.onclick = ()=>load(i);
    box.appendChild(d);
  });
  $("count").textContent = `${TRACKS.length} tracks · ${TRACKS.filter(t=>t.url).length} linked`;
}
$("prev").onclick = ()=>load((cur-1+TRACKS.length)%TRACKS.length);
$("next").onclick = ()=>load((cur+1)%TRACKS.length);
$("shuffle").onclick = ()=>load(Math.floor(Math.random()*TRACKS.length));
$("q").oninput = e=>{filter=e.target.value.trim().toLowerCase();render();};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(e.key==="ArrowRight")$("next").click();
  if(e.key==="ArrowLeft")$("prev").click();
});
load(0);
</script>
</body>
</html>
