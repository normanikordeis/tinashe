<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIM PETRAS — DETOUR</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:'Inter',sans-serif;
  background:
    linear-gradient(rgba(15,0,20,.82),rgba(15,0,20,.92)),
    url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=1800&auto=format&fit=crop');
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  color:white;
  overflow-x:hidden;
}

/* ROAD EFFECT */

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 80px,
      rgba(255,255,255,.08) 80px,
      rgba(255,255,255,.08) 100px
    );
  opacity:.25;
  animation:roadMove 2s linear infinite;
  pointer-events:none;
}

@keyframes roadMove{
  from{
    transform:translateY(0);
  }
  to{
    transform:translateY(100px);
  }
}

/* NAV */

.topbar{
  position:fixed;
  top:0;
  width:100%;
  z-index:999;
  background:rgba(255,20,120,.2);
  backdrop-filter:blur(18px);
  border-bottom:2px solid rgba(255,220,0,.4);
}

.topbar-inner{
  max-width:1300px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 20px;
}

.logo{
  font-weight:900;
  letter-spacing:3px;
  text-shadow:0 0 15px #ff5db9;
}

.nav-links{
  display:flex;
  gap:12px;
}

.nav-links a{
  text-decoration:none;
  color:white;
  padding:10px 18px;
  border-radius:999px;
  background:rgba(255,255,255,.1);
  transition:.3s;
}

.nav-links a:hover{
  background:#ff4fa3;
  transform:translateY(-2px);
}

/* HERO */

.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:120px 20px;
  position:relative;
}

.hero::before{
  content:"";
  position:absolute;
  top:90px;
  left:-10%;
  width:130%;
  height:50px;
  background:
    repeating-linear-gradient(
      45deg,
      #ffd400 0 30px,
      #111 30px 60px
    );
  transform:rotate(-4deg);
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:1200px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
  align-items:center;
}

.hero-copy{
  background:rgba(255,80,170,.15);
  padding:40px;
  border-radius:30px;
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.15);
}

.kim{
  letter-spacing:8px;
  margin-bottom:15px;
}

.detour{
  font-size:clamp(4rem,12vw,9rem);
  line-height:.9;
  font-weight:900;
  text-shadow:
    0 0 20px #ff5db9,
    0 0 60px #ff0088;
}

.release{
  margin-top:20px;
  font-size:1.2rem;
  letter-spacing:4px;
}

.enter-btn{
  display:inline-flex;
  align-items:center;
  gap:10px;
  margin-top:30px;
  text-decoration:none;
  color:black;
  background:white;
  padding:16px 26px;
  border-radius:999px;
  font-weight:700;
  transition:.3s;
}

.enter-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 0 25px rgba(255,0,128,.5);
}

/* WINDOW */

.floating-window{
  background:rgba(255,255,255,.08);
  padding:20px;
  border-radius:28px;
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.15);
}

.window-image{
  width:100%;
  border-radius:22px;
  object-fit:cover;
}

.status-box{
  margin-top:20px;
  background:rgba(255,255,255,.08);
  padding:16px;
  border-radius:20px;
}

/* SECTION */

section{
  padding:90px 20px;
}

.container{
  max-width:1300px;
  margin:auto;
}

.section-title{
  display:inline-block;
  background:#ff9f1c;
  color:black;
  padding:16px 24px;
  border:5px solid black;
  transform:rotate(-2deg);
  margin-bottom:25px;
  font-size:clamp(2rem,5vw,4rem);
  font-weight:900;
}

.section-sub{
  opacity:.8;
  max-width:700px;
  line-height:1.7;
  margin-bottom:40px;
}

/* PLAYER */

.player-shell{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:35px;
}

.player-ui{
  background:rgba(255,255,255,.08);
  padding:30px;
  border-radius:30px;
  backdrop-filter:blur(20px);
}

.player-display{
  text-align:center;
}

.disc{
  width:240px;
  height:240px;
  border-radius:50%;
  margin:auto;
  background-size:cover;
  background-position:center;
  border:10px solid rgba(255,255,255,.15);
  animation:spin 10s linear infinite;
}

@keyframes spin{
  from{
    transform:rotate(0deg);
  }
  to{
    transform:rotate(360deg);
  }
}

.song-title{
  margin-top:25px;
  font-size:1.4rem;
  font-weight:700;
}

.controls{
  margin-top:30px;
  display:flex;
  justify-content:center;
  gap:18px;
}

.controls button{
  width:60px;
  height:60px;
  border:none;
  border-radius:50%;
  cursor:pointer;
  font-size:1rem;
  background:white;
}

.playlist{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.track{
  background:rgba(255,255,255,.08);
  padding:14px;
  border-radius:20px;
  cursor:pointer;
  transition:.3s;
  border:1px solid rgba(255,255,255,.1);
}

.track:hover{
  transform:translateX(8px);
}

.track.active{
  background:rgba(255,100,180,.25);
}

.track-flex{
  display:flex;
  gap:15px;
  align-items:center;
}

.track-thumb{
  width:65px;
  height:65px;
  border-radius:16px;
  object-fit:cover;
}

/* GALLERY */

.gallery-grid{
  columns:3 260px;
  column-gap:18px;
}

.gallery-item{
  margin-bottom:18px;
  overflow:hidden;
  border-radius:22px;
  position:relative;
}

.gallery-item img{
  width:100%;
  display:block;
  transition:1s;
}

.gallery-item:hover img{
  transform:scale(1.08);
}

.caption{
  position:absolute;
  bottom:12px;
  left:12px;
  background:rgba(0,0,0,.6);
  padding:8px 14px;
  border-radius:999px;
}

/* FOOTER */

footer{
  padding:100px 20px;
  text-align:center;
}

.footer-title{
  font-size:clamp(3rem,8vw,6rem);
  font-weight:900;
  text-shadow:0 0 25px #ff0088;
}

.socials{
  margin-top:30px;
  display:flex;
  justify-content:center;
  gap:18px;
}

.socials a{
  width:55px;
  height:55px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:rgba(255,255,255,.1);
  color:white;
  text-decoration:none;
  font-size:1.2rem;
}

@media(max-width:900px){

  .hero-content,
  .player-shell{
    grid-template-columns:1fr;
  }

  .nav-links{
    display:none;
  }

}

</style>
</head>

<body>

<header class="topbar">

  <div class="topbar-inner">

    <div class="logo">
      KIM PETRAS — DETOUR
    </div>

    <nav class="nav-links">
      <a href="#radio">RADIO</a>
      <a href="#gallery">GALLERY</a>
    </nav>

  </div>

</header>

<section class="hero">

  <div class="hero-content">

    <div class="hero-copy">

      <div class="kim">
        KIM PETRAS
      </div>

      <h1 class="detour">
        DETOUR
      </h1>

      <div class="release">
        MAY 29 2026
      </div>

      <a href="#radio" class="enter-btn">
        ENTER DETOUR
        <i class="fa-solid fa-arrow-right"></i>
      </a>

    </div>

    <div class="floating-window">

      <img
      class="window-image"
      src="https://images.unsplash.com/photo-1493238792000-8113da705763?q=80&w=1200&auto=format&fit=crop"
      alt="Detour aesthetic">

      <div class="status-box" id="statusBox">
        🚧 DETOUR AHEAD
      </div>

    </div>

  </div>

</section>

<section id="radio">

  <div class="container">

    <h2 class="section-title">
      DETOUR RADIO
    </h2>

    <p class="section-sub">
      Hyperpop traffic. Pink highways. Chrome dreams.
    </p>

    <div class="player-shell">

      <div class="player-ui">

        <div class="player-display">

          <div
          class="disc"
          id="disc"
          style="background-image:url('https://i.imgur.com/UPrs1EW.jpeg')">
          </div>

          <div
          class="song-title"
          id="songTitle">
            Polo
          </div>

          <div class="controls">

            <button id="prevBtn">
              <i class="fa-solid fa-backward"></i>
            </button>

            <button id="playBtn">
              <i class="fa-solid fa-play"></i>
            </button>

            <button id="nextBtn">
              <i class="fa-solid fa-forward"></i>
            </button>

          </div>

        </div>

      </div>

      <div class="playlist" id="playlist"></div>

    </div>

  </div>

</section>

<section id="gallery">

  <div class="container">

    <h2 class="section-title">
      DETOUR ARCHIVE
    </h2>

    <div class="gallery-grid">

      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1200&auto=format&fit=crop">
        <div class="caption">night drive</div>
      </div>

      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?q=80&w=1200&auto=format&fit=crop">
        <div class="caption">chrome fantasy</div>
      </div>

      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1511919884226-fd3cad34687c?q=80&w=1200&auto=format&fit=crop">
        <div class="caption">pink traffic</div>
      </div>

    </div>

  </div>

</section>

<footer>

  <div class="footer-title">
    DETOUR
  </div>

  <div class="socials">

    <a href="https://www.instagram.com/kimpetras/" target="_blank">
      <i class="fab fa-instagram"></i>
    </a>

    <a href="https://www.youtube.com/@KimPetras" target="_blank">
      <i class="fab fa-youtube"></i>
    </a>

    <a href="https://open.spotify.com/artist/3Xt3RrJMFv5SZkCfUE8C1J" target="_blank">
      <i class="fab fa-spotify"></i>
    </a>

  </div>

</footer>

<iframe
id="youtubePlayer"
width="0"
height="0"
style="display:none"
allow="autoplay">
</iframe>

<script>

const tracks = [

{
  title:"Polo",
  image:"https://i.imgur.com/UPrs1EW.jpeg",
  url:"https://www.youtube.com/watch?v=7T2RonyJ_Ts"
},

{
  title:"Freak It",
  image:"https://i.imgur.com/j8kP4Q7.jpeg",
  url:"https://www.youtube.com/watch?v=gJowEhMVgks"
},

{
  title:"I Like Ur Look",
  image:"https://i.imgur.com/WY0P7QS.jpeg",
  url:"https://www.youtube.com/watch?v=8kEwU0mG4I8"
},

{
  title:"Need For Speed",
  image:"https://i.imgur.com/xXQJ6lM.jpeg",
  url:"https://www.youtube.com/watch?v=YQ-qToZU4VQ"
},

{
  title:"Jeep",
  image:"https://i.imgur.com/J4K0L2B.jpeg",
  url:"https://www.youtube.com/watch?v=5CPeHQHAQyo"
}

];

let currentTrack = 0;
let playing = false;

const playlistEl = document.getElementById('playlist');
const songTitle = document.getElementById('songTitle');
const iframe = document.getElementById('youtubePlayer');
const playBtn = document.getElementById('playBtn');
const disc = document.getElementById('disc');

tracks.forEach((track,index)=>{

  const div = document.createElement('div');

  div.className = 'track';

  if(index === 0){
    div.classList.add('active');
  }

  div.innerHTML = `

    <div class="track-flex">

      <img
      class="track-thumb"
      src="${track.image}">

      <div>

        <strong>
          ${index + 1}. ${track.title}
        </strong>

        <div style="opacity:.7;margin-top:5px;">
          🚧 DETOUR TRANSMISSION
        </div>

      </div>

    </div>

  `;

  div.addEventListener('click',()=>{

    currentTrack = index;

    loadTrack();

  });

  playlistEl.appendChild(div);

});

function loadTrack(){

  const current = tracks[currentTrack];

  document.querySelectorAll('.track').forEach((track,index)=>{

    track.classList.toggle(
      'active',
      index === currentTrack
    );

  });

  songTitle.innerHTML = current.title;

  disc.style.backgroundImage =
    `url('${current.image}')`;

  iframe.src =
    current.url.replace(
      "watch?v=",
      "embed/"
    ) + "?autoplay=1";

  playBtn.innerHTML =
    '<i class="fa-solid fa-pause"></i>';

  playing = true;

}

playBtn.addEventListener('click',()=>{

  if(!playing){

    loadTrack();

  } else {

    iframe.src = "";

    playing = false;

    playBtn.innerHTML =
      '<i class="fa-solid fa-play"></i>';

  }

});

document.getElementById('nextBtn')
.addEventListener('click',()=>{

  currentTrack =
    (currentTrack + 1) % tracks.length;

  loadTrack();

});

document.getElementById('prevBtn')
.addEventListener('click',()=>{

  currentTrack =
    (currentTrack - 1 + tracks.length)
    % tracks.length;

  loadTrack();

});

const signs = [

  "🚧 DETOUR AHEAD",
  "💖 HYPERPOP TRAFFIC",
  "🛣️ EXITING REALITY",
  "⚠️ POP EMERGENCY",
  "🚗 KIM PETRAS EXPRESSWAY"

];

setInterval(()=>{

  const random =
    signs[Math.floor(Math.random() * signs.length)];

  document.getElementById('statusBox')
  .innerHTML = random;

},3000);

</script>

</body>
</html>
