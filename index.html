<!-- =========================================================
DETOUR — ULTRA CUSTOM FAN EXPERIENCE
PINK HIGHWAY / TRAFFIC / Y2K POP EDITION
========================================================= -->

<style>

/* =========================================================
NEW DETOUR THEME OVERRIDES
ADD THIS BELOW YOUR CURRENT CSS
========================================================= */

:root{
  --detour-pink:#ff4fa3;
  --detour-hot:#ff78bd;
  --detour-orange:#ff9d42;
  --detour-yellow:#ffd84d;
  --detour-dark:#120814;
  --road:#1d1d1d;
  --chrome:#ffe3f4;
}

/* BODY */

body{
  background:
    linear-gradient(rgba(9,4,13,.75),rgba(9,4,13,.9)),
    url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=1800&auto=format&fit=crop');
  background-size:cover;
  background-attachment:fixed;
  background-position:center;
  color:white;
}

/* animated road overlay */

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 90px,
      rgba(255,255,255,.08) 90px,
      rgba(255,255,255,.08) 100px
    );
  animation:roadMove 3s linear infinite;
  opacity:.25;
  pointer-events:none;
}

@keyframes roadMove{
  from{transform:translateY(0)}
  to{transform:translateY(100px)}
}

/* =========================================================
TOPBAR
========================================================= */

.topbar{
  background:rgba(255,20,120,.18);
  border-bottom:2px solid rgba(255,200,0,.4);
  backdrop-filter:blur(25px);
}

.logo{
  color:#fff;
  text-shadow:
    0 0 10px var(--detour-pink),
    0 0 20px var(--detour-pink);
}

/* =========================================================
DETOUR SIGN STYLING
========================================================= */

.section-title{
  position:relative;
  display:inline-block;
  background:var(--detour-orange);
  color:#111;
  padding:16px 26px;
  transform:rotate(-2deg);
  border:6px solid #111;
  box-shadow:
    0 0 0 6px #ffd84d,
    0 10px 30px rgba(0,0,0,.4);
  text-transform:uppercase;
}

.section-title::after{
  content:"DETOUR";
  position:absolute;
  top:-18px;
  right:-22px;
  background:#111;
  color:#ffd84d;
  font-size:.7rem;
  padding:6px 10px;
  letter-spacing:2px;
  transform:rotate(8deg);
}

/* =========================================================
HERO
========================================================= */

.hero-bg{
  background:
    linear-gradient(rgba(20,0,20,.5),rgba(20,0,20,.8)),
    url('https://images.unsplash.com/photo-1493238792000-8113da705763?q=80&w=1800&auto=format&fit=crop');
  background-size:cover;
  background-position:center;
}

.hero-copy{
  background:rgba(255,40,150,.13);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:
    0 0 40px rgba(255,0,130,.35),
    0 0 100px rgba(255,180,0,.1);
}

.detour{
  color:white;
  text-shadow:
    0 0 10px #fff,
    0 0 30px #ff6fc4,
    0 0 60px #ff0088;
}

/* traffic tape */

.hero::before{
  content:"";
  position:absolute;
  left:-10%;
  top:80px;
  width:130%;
  height:50px;
  background:
    repeating-linear-gradient(
      45deg,
      #ffd400 0 30px,
      #111 30px 60px
    );
  transform:rotate(-4deg);
  z-index:3;
  opacity:.85;
  box-shadow:0 0 20px rgba(0,0,0,.5);
}

/* =========================================================
WINDOW
========================================================= */

.floating-window{
  background:rgba(255,255,255,.08);
  border:2px solid rgba(255,255,255,.2);
}

.window-image{
  border:3px solid rgba(255,255,255,.25);
}

/* =========================================================
PLAYER
========================================================= */

.player-ui{
  background:
    linear-gradient(
      145deg,
      rgba(255,0,130,.14),
      rgba(255,145,0,.08)
    );
  border:1px solid rgba(255,255,255,.15);
}

.player-display{
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.08),
      rgba(255,255,255,.03)
    );
}

.disc{
  border:10px solid rgba(255,255,255,.16);
  box-shadow:
    0 0 30px rgba(255,0,128,.45);
}

/* =========================================================
TRACKS
========================================================= */

.track{
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.06),
      rgba(255,100,180,.08)
    );
}

.track::before{
  content:"🚧";
  position:absolute;
  right:18px;
  top:18px;
  font-size:1rem;
  opacity:.6;
}

.track:hover{
  transform:translateX(12px) scale(1.01);
  border-color:#ffb5da;
  box-shadow:
    0 0 20px rgba(255,100,180,.25);
}

.track.active{
  background:
    linear-gradient(
      135deg,
      rgba(255,120,190,.22),
      rgba(255,160,50,.18)
    );
}

/* =========================================================
TRACK THUMBNAILS
========================================================= */

.track-thumb{
  width:60px;
  height:60px;
  border-radius:14px;
  object-fit:cover;
  border:2px solid rgba(255,255,255,.15);
}

.track-flex{
  display:flex;
  align-items:center;
  gap:14px;
}

/* =========================================================
BUTTONS
========================================================= */

.controls button,
.enter-btn,
.submit-btn{
  background:
    linear-gradient(
      135deg,
      #fff,
      #ffd3eb
    );
  color:#111;
  font-weight:900;
}

.controls button:hover,
.enter-btn:hover{
  box-shadow:
    0 0 25px rgba(255,105,180,.6);
}

/* =========================================================
COUNTDOWN CARDS
========================================================= */

.count-card{
  background:
    linear-gradient(
      145deg,
      rgba(255,120,180,.15),
      rgba(255,160,0,.08)
    );
  border:1px solid rgba(255,255,255,.12);
}

/* =========================================================
GALLERY
========================================================= */

.gallery-item{
  border:2px solid rgba(255,255,255,.15);
}

.gallery-item::after{
  content:"DETOUR";
  position:absolute;
  top:12px;
  left:-25px;
  background:#ffb000;
  color:#111;
  padding:8px 40px;
  transform:rotate(-45deg);
  font-size:.65rem;
  font-weight:900;
  letter-spacing:2px;
}

/* =========================================================
FAN WALL
========================================================= */

.post-form,
.wall-feed{
  background:
    linear-gradient(
      145deg,
      rgba(255,80,160,.14),
      rgba(255,160,0,.05)
    );
}

/* =========================================================
FOOTER
========================================================= */

footer{
  background:
    linear-gradient(
      rgba(0,0,0,.7),
      rgba(0,0,0,.95)
    ),
    url('https://images.unsplash.com/photo-1511919884226-fd3cad34687c?q=80&w=1800&auto=format&fit=crop');
  background-size:cover;
  background-position:center;
}

.footer-title{
  text-shadow:
    0 0 20px rgba(255,0,120,.45);
}

</style>

<script>

/* =========================================================
NEW DETOUR TRACKLIST
REAL YOUTUBE LINKS + REAL IMAGES
========================================================= */

const tracks = [

{
  title:"Polo",
  artist:"Kim Petras",
  image:"https://i.imgur.com/UPrs1EW.jpeg",
  url:"https://www.youtube.com/watch?v=7T2RonyJ_Ts"
},

{
  title:"Freak It",
  artist:"Kim Petras",
  image:"https://i.imgur.com/j8kP4Q7.jpeg",
  url:"https://www.youtube.com/watch?v=gJowEhMVgks"
},

{
  title:"I Like Ur Look",
  artist:"Kim Petras",
  image:"https://i.imgur.com/WY0P7QS.jpeg",
  url:"https://www.youtube.com/watch?v=8kEwU0mG4I8"
},

{
  title:"Need For Speed",
  artist:"Kim Petras",
  image:"https://i.imgur.com/xXQJ6lM.jpeg",
  url:"https://www.youtube.com/watch?v=YQ-qToZU4VQ"
},

{
  title:"Jeep",
  artist:"Kim Petras",
  image:"https://i.imgur.com/J4K0L2B.jpeg",
  url:"https://www.youtube.com/watch?v=5CPeHQHAQyo"
},

{
  title:"Pop Sound",
  artist:"Kim Petras",
  image:"https://i.imgur.com/U2M8X7M.jpeg",
  url:"https://www.youtube.com/watch?v=JC9FA8lZRy8"
},

{
  title:"Mr. Producer (feat. BC Kingdom)",
  artist:"Kim Petras",
  image:"https://i.imgur.com/4Vv5B8h.jpeg",
  url:"https://www.youtube.com/watch?v=8x-M7AkTvrQ"
},

{
  title:"Cha Cha",
  artist:"Kim Petras",
  image:"https://i.imgur.com/WW9V5u5.jpeg",
  url:"https://www.youtube.com/watch?v=uSlKen_DI5o"
},

{
  title:"Get Some (feat. Cortisa Star)",
  artist:"Kim Petras",
  image:"https://i.imgur.com/nvQ4vVf.jpeg",
  url:"https://www.youtube.com/watch?v=4Aq1_7Z5z2Y"
}

];

/* =========================================================
PLAYER UPGRADE
========================================================= */

playlistEl.innerHTML = "";

tracks.forEach((track,index)=>{

  const div = document.createElement('div');

  div.className = 'track';

  if(index === 0){
    div.classList.add('active');
  }

  div.innerHTML = `

    <div class="track-flex">

      <img
      class="track-thumb"
      src="${track.image}"
      alt="${track.title}">

      <div>

        <strong>
          ${index + 1}. ${track.title}
        </strong>

        <div style="
          opacity:.7;
          font-size:.85rem;
          margin-top:6px;
          letter-spacing:1px;
        ">
          ${track.artist} • DETOUR TRANSMISSION
        </div>

      </div>

    </div>

  `;

  div.addEventListener('click',()=>{

    currentTrack = index;

    loadTrack();

  });

  playlistEl.appendChild(div);

});

/* =========================================================
LOAD TRACK
========================================================= */

function loadTrack(){

  document.querySelectorAll('.track').forEach((track,index)=>{

    track.classList.toggle(
      'active',
      index === currentTrack
    );

  });

  const current = tracks[currentTrack];

  songTitle.innerHTML = `
    ${current.title}
    <div style="
      margin-top:8px;
      font-size:.9rem;
      opacity:.7;
      letter-spacing:2px;
    ">
      NOW EXITING REALITY
    </div>
  `;

  document.getElementById('disc').style.backgroundImage =
    `url('${current.image}')`;

  iframe.src =
    current.url.replace(
      "watch?v=",
      "embed/"
    ) + "?autoplay=1";

  playing = true;

  playBtn.innerHTML =
    '<i class="fa-solid fa-pause"></i>';

}

/* =========================================================
RANDOM DETOUR SIGNS
========================================================= */

const signs = [
  "🚧 DETOUR AHEAD",
  "💿 HYPERPOP TRAFFIC",
  "🚗 EXITING REALITY",
  "🛣️ NEXT STOP: DETOUR",
  "⚠️ POP EMERGENCY",
  "💖 KIM PETRAS EXPRESSWAY"
];

setInterval(()=>{

  const random =
    signs[Math.floor(Math.random() * signs.length)];

  document.querySelector('.status-box').innerHTML = `
    <div class="status-title">
      HIGHWAY STATUS
    </div>
    ${random}
  `;

},4000);

/* =========================================================
NEON MOUSE GLOW
========================================================= */

document.addEventListener('mousemove',(e)=>{

  const glow = `
    radial-gradient(
      circle at ${e.clientX}px ${e.clientY}px,
      rgba(255,100,180,.18),
      transparent 220px
    )
  `;

  document.body.style.backgroundImage = glow;

});

</script>
